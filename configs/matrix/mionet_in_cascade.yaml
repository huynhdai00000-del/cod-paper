experiment:
  name: cod_matrix
  variant: mionet_in_cascade
  notes: C-11 tier-1 matrix cell. Generated by scripts/make_matrix_configs.py -- edit
    that, not this.
distribution:
  n_ic: 8000
  n_sensors: 100
  seed: 42
  steady_state_formula: true_fixed_point
  window_minutes: 720
  sampler:
    kind: realistic
    params:
      cycle_period: 1440.0
      hot_spot_mean: 86.0
      hot_spot_sd: 11.0
      hot_spot_bounds:
      - 62.0
      - 122.0
      K_bounds:
      - 0.3
      - 1.4
      K_amp:
      - 0.12
      - 0.28
      base_load_frac: 0.5
      overload_K:
      - 1.15
      - 1.4
      Ta_base:
      - 15.0
      - 40.0
      Ta_amp:
      - 3.0
      - 8.0
      hist_sigma: 3.0
      hist_clip: 8.0
      sensor_sigma: 0.5
      theta_TO_bounds:
      - 30.0
      - 130.0
      burn_in_cycles: 3
      service_factor:
      - 0.45
      - 1.35
      fault_prob: 0.08
      fault_gases:
      - 0
      - 1
      - 2
      fault_factor:
      - 2.0
      - 7.0
      gas_floor_frac: 0.02
      families:
      - base_load
      - daily
      - ramp
      - shift_change
      - evening_peak
      - overload_spike
      - multi_step
      weights:
      - 0.18
      - 0.22
      - 0.12
      - 0.14
      - 0.16
      - 0.08
      - 0.1
model:
  kind: mionet_in_cascade
  notes: MIONet predicting theta_TO only; gases by Arrhenius quadrature.
  mionet:
    depth: 2
    width: 200
    basis_dim: 200
training:
  seed: 1
  loop: train_physics
  n_collocation: 80
  n_chunks: 5
  optimizer: adam
  lr: 0.001
  lr_schedule: cosine
  batch_size: 64
  convergence:
    max_epochs: 25000
    max_wall_seconds: 7200
    patience: 20
    min_delta_rel: 0.001
    check_every: 100
  causal_weighting:
    enabled: true
    eps_init: 0.01
    eps_max: 50.0
    log_space: true
    weight_floor: 1.0e-08
    schedule_shared: true
evaluation:
  rollout_years: 1
  tiers:
    T1_in_distribution:
      n_cases: 100
      seed: 999
      source: realistic_sampler
    T2_extrapolation:
      n_cases: 100
      seed: 998
      K_base:
      - 0.3
      - 1.5
    T3_out_of_family:
      n_cases: 100
      seed: 997
      source: ett_load_profiles
    T3_v57_benchmark:
      n_cases: 100
      seed: 999
      source: v57_benchmark
  ground_truth:
    solver: RK45
    rtol: 1.0e-08
    atol: 1.0e-10
    right_edge_guard: 0.9999
  timing_reference:
    solver: LSODA
    rtol: matched_to_model_accuracy
