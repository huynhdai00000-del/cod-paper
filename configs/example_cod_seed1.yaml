experiment:
  name: cod_transformer
  variant: cod
  notes: "Reference run. Edit nothing in `distribution` after freezing."

# Frozen before any model was trained. Hash recorded in DISTRIBUTION_FREEZE.md.
# Any edit here must be logged in CHANGELOG_DISTRIBUTION.md and disclosed.
distribution:
  n_ic: 8000
  n_sensors: 100
  seed: 42
  steady_state_formula: true_fixed_point   # Phase 2 fix 1
  window_minutes: 720          # TW = 12 h; the scaffold said 1440 (PORT_LOG J-11)

  # The sampler is part of the distribution, so it is named inside the hashed
  # block rather than chosen in code. `params` must list EVERY field of
  # RealisticParams: `from_config` rejects the config if one is missing, and
  # equally if a key here is not a field the sampler reads. The previous version
  # of this file carried K_base, ambient_base, ambient_amplitude and nine
  # profile_families that reached no sampler at all — editing them moved the hash
  # and changed nothing (DISTRIBUTION_FREEZE.md §2.1). That cannot recur silently.
  sampler:
    kind: realistic
    params:
      # Load pattern is a DAY; the 720 min window is a slice at random phase.
      # A 12 h period here is the N-6 defect: it under-drives the thermal system
      # by 1/sqrt(1+(omega tau)^2) and forces K_amp up to compensate.
      cycle_period: 1440.0
      # Operating point. The hot-spot is drawn and the load solved for, because a
      # fleet is loaded to keep temperature in band. IEC 60076-7: rated 98 degC,
      # normal-cyclic ceiling 120, long-time emergency 140.
      hot_spot_mean: 86.0
      hot_spot_sd: 11.0
      hot_spot_bounds: [62.0, 122.0]
      K_bounds: [0.30, 1.40]
      # Daily load swing about the unit's own mean. Deliberately NOT rescaled to
      # ETT: see PORT_LOG J-74 and DECISIONS O-10 §7 -- the 0.850 rescale is a
      # scope decision about which feeder population the benchmark is about.
      K_amp: [0.12, 0.28]
      base_load_frac: 0.50
      overload_K: [1.15, 1.40]
      # Ambient: 6-16 degC diurnal peak-to-peak, random phase (Phase 2 fix 4).
      Ta_base: [15.0, 40.0]
      Ta_amp: [3.0, 8.0]
      # Initial condition: spread about the day's own periodic steady state.
      hist_sigma: 3.0
      hist_clip: 8.0
      sensor_sigma: 0.5
      theta_TO_bounds: [30.0, 130.0]
      burn_in_cycles: 3
      # Gases: equilibrium at the day-mean hot-spot times a service factor, with
      # a minority carrying an incipient fault.
      service_factor: [0.45, 1.35]
      fault_prob: 0.08
      fault_gases: [0, 1, 2]          # H2, C2H2, C2H4
      fault_factor: [2.0, 7.0]
      gas_floor_frac: 0.02
      families: [base_load, daily, ramp, shift_change, evening_peak,
                 overload_spike, multi_step]
      weights: [0.18, 0.22, 0.12, 0.14, 0.16, 0.08, 0.10]

model:
  kind: cod
  branch: {layers: 4, width: 128, arch: modified_mlp}
  trunk:  {layers: 3, width: 128, arch: modified_mlp}
  basis_dim: 64
  analytical_baseline: iec_60076_7

training:
  seed: 1
  loop: train_v34
  n_collocation: 80
  n_chunks: 5
  optimizer: adam
  lr: 1.0e-3
  lr_schedule: cosine
  batch_size: 64
  convergence:
    max_epochs: 25000
    # 7200 s, and deliberately NOT the C-11 figure. DO NOT INHERIT THIS.
    #
    # The 3600 s this replaced belongs to the C-11 fairness protocol, where equal
    # wall clock across architectures is the whole point (audit B-1: the same
    # 25,000 epochs ran 4.6x apart in time). O-5 is not a comparison. It is a
    # sanity check that fixes 1-9 broke nothing, and a non-converged model cannot
    # answer that question at all — it would leave "did the physics fixes break
    # training?" and "did the budget bind?" confounded.
    #
    # Different purpose, different budget. The tier-1 matrix budget is a separate
    # decision, taken later: set it where COD converges comfortably, then apply
    # that same figure to every architecture in the matrix. Copying 7200 out of
    # this file into a comparison config would import a number chosen for a
    # different reason.
    max_wall_seconds: 7200
    patience: 20
    min_delta_rel: 1.0e-3
    check_every: 100
  causal_weighting:
    enabled: true
    eps_init: 0.01
    eps_max: 50.0
    log_space: true      # prevents the underflow that made one baseline unfair
    weight_floor: 1.0e-8
    schedule_shared: true  # same eps trajectory for every model (fix 3)

evaluation:
  rollout_years: 1
  tiers:
    T1_in_distribution: {n_cases: 100, seed: 999}
    T2_extrapolation:   {n_cases: 100, seed: 998, K_base: [0.3, 1.5]}
    T3_out_of_family:   {n_cases: 100, seed: 997, source: ett_load_profiles}
  ground_truth:
    solver: RK45
    rtol: 1.0e-8
    atol: 1.0e-10
    right_edge_guard: 0.9999
  timing_reference:
    solver: LSODA
    rtol: matched_to_model_accuracy   # not 1e-8: that would be unfair
