experiment:
  name: cod_transformer
  variant: v57_faithful
  notes: >
    Phase 1. Describes the v57 run AS IT ACTUALLY RAN, defects included, so the
    checkpoints are reproducible. This is a record, not a recommendation. The
    Phase 2 target config is configs/example_cod_seed1.yaml.

# NOT frozen: this block documents a distribution that already produced results,
# which is the opposite of the freeze-before-training protocol. No entry in
# DISTRIBUTION_FREEZE.md corresponds to it.
distribution:
  # The v57-era sampler. Its ranges live in cod/data/profiles.py and are
  # deliberately hardcoded and deliberately not configurable: this config exists
  # to reproduce transformer_training_v57.npz byte for byte, and a reproduction
  # gate that a YAML edit can move is not a gate. `params` is rejected here.
  #
  # Every key below documents what that hardcoded sampler does. They are a record,
  # not an input -- with the exception of seed, window_minutes, ambient_phase and
  # steady_state_formula, which do reach the generator.
  sampler:
    kind: v57
  n_ic: 8000
  window_minutes: 720          # TW = 720 min = 12 h. The scaffold said 1440.
  n_sensors: 100
  seed: 42
  K_base: [0.5, 1.2]
  ambient_base: [15.0, 45.0]
  ambient_amplitude: [0.0, 8.0]
  ambient_phase: [0.0, 0.0]    # DEFECT (audit B-5): fixed at 0 while the test
                               # set uses pi/3. Phase 2 fix 4 randomises it.
  steady_state_formula: A      # DEFECT (audit M-6): formula A builds every IC
                               # and is off by -18.25 degC at K=1.3, theta_a=30
                               # against the true fixed point.
  ic_high_K_oversample: {probability: 0.2, K: [1.0, 1.3]}
  ic_K: [0.4, 1.3]
  ic_ambient: [15.0, 40.0]
  ic_theta_TO_offset: [-30.0, 30.0]
  ic_gas_multiplier: [0.5, 1.2]
  # Ten families, not the eight the manuscript claims. `daily` and `tv_ramp_sin`
  # carry 15% of the mass and are undeclared (audit section 5).
  profile_families:
    - {kind: flat,           weight: 0.11}
    - {kind: ramp,           weight: 0.10}
    - {kind: daily,          weight: 0.08}
    - {kind: sinusoidal,     weight: 0.12, amp: [0.05, 0.40], period_rel: [0.5, 2.0]}
    - {kind: step,           weight: 0.11, clipped: false}   # DEFECT: no .clip(),
                                                             # so K reaches 0.2571
    - {kind: overload_spike, weight: 0.11}
    - {kind: multi_step,     weight: 0.11}
    - {kind: peak_then_drop, weight: 0.11}
    - {kind: tv_high_amp,    weight: 0.08, amp: [0.30, 0.50]}
    - {kind: tv_ramp_sin,    weight: 0.07}

model:
  kind: cod
  branch: {layers: 4, width: 128, arch: modified_mlp}
  trunk:  {layers: 3, width: 64,  arch: modified_mlp}
  basis_dim: 64
  n_exp_feats: 12
  analytical_baseline: iec_60076_7
  thermal_grid_detached: true   # INTENDED cascade behaviour, not a bug.
                                # See cod/models/cod.py and step4_gradient_flow.md.

training:
  seed: 42
  loop: train_v34               # not train_physics; see cod/training/train.py
  optimizer: adam
  lr: 1.0e-3
  lr_schedule: cosine
  lr_min: 1.0e-5
  batch_size: 128
  n_collocation: 80
  n_chunks: 5
  grad_clip_norm: 1.0
  adaptive_state_weights:
    ema: 0.70
    ratio_clamp: [0.1, 50.0]
    thermal_floor: 5.0          # DEFECT (audit M-4): the reported ~5 is this
                                # floor, not a learned value
  convergence:
    max_epochs: 25000
    max_wall_seconds: 3600
    patience: 20
    min_delta_rel: 1.0e-3
    check_every: 100
  causal_weighting:
    enabled: true
    eps_init: 0.01
    eps_max: 50.0
    eps_factor: 1.10
    eps_patience: 200
    log_space: false            # DEFECT (audit B-1): underflows to exactly 0.0.
    weight_floor: 0.0           # Phase 2 fix 3 sets log_space true, floor 1e-8,
    schedule_shared: false      # and shares the schedule across models.

evaluation:
  tiers:
    # One tier only, and it is not out of distribution. Labelled honestly:
    # the TV waveform sits inside every training marginal (audit B-5), and 14 of
    # 50 constant-K cases extrapolate past the training K range (audit M-8, whose
    # own count of 20 is a slip -- PORT_LOG J-9).
    # `source: v57_benchmark` and the label agree here, and that is the point of
    # declaring it: this config trains on the v57 sampler, so the v57 benchmark
    # really is in-distribution for it. The same tier under the realistic sampler
    # is not, which is why the source is now stated rather than assumed.
    T1_in_distribution: {n_cases: 100, seed: 999, n_eval_times: 50,
                         source: v57_benchmark}
  ground_truth:
    solver: RK45
    rtol: 1.0e-8
    atol: 1.0e-10
    right_edge_guard: 0.9999    # n12 evaluate_v44; n15/n00 evaluate_100 use 0.999
  metric:
    primary: nmae
    nmae_denominator_floor: 1.0e-4   # DEFECT (audit M-3): binds on 38% of C2H2
                                     # cases. Report absolute MAE instead.
